[package]
name = "mewoos"
version = "0.1.0"
edition = "2021"

[dependencies]
uefi = { version = "0.36", features = ["logger", "panic_handler", "alloc"] }
log = { version = "0.4", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
